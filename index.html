<style>
  :root{
    --bg:#07100e;
    --glow:#0f2b25;
    --ink:#e9fff9;
    --muted:#62817b;
    --hair:rgba(110,231,200,.14);
    --accent:#6ee7c8;
    --accent-2:#7cc7ff;
    --track:rgba(110,231,200,.10);
    --bar:rgba(110,231,200,.07);
    --bar-2:rgba(124,199,255,.16);
    --dial:rgba(255,255,255,.015);
    --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2f6f5;
      --glow:#d7ece6;
      --ink:#08201b;
      --muted:#6d8a83;
      --hair:rgba(10,60,50,.12);
      --accent:#0f9e7e;
      --accent-2:#2b7fc4;
      --track:rgba(10,60,50,.10);
      --bar:rgba(15,158,126,.09);
      --bar-2:rgba(43,127,196,.20);
      --dial:rgba(255,255,255,.55);
      --shadow:rgba(20,60,50,.12);
      color-scheme:light;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% -10%, var(--glow) 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  main{
    width:100%;
    max-width:420px;
    padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
  }

  .brand{
    display:flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--muted);
  }
  .brand i{
    width:5px;height:5px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent);
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---------- dial ---------- */
  .dial{
    position:relative;
    width:min(78vw,306px);
    aspect-ratio:1;
    border:0;
    padding:0;
    border-radius:50%;
    background:var(--dial);
    color:inherit;
    cursor:pointer;
    display:grid;
    place-items:center;
    box-shadow:0 26px 60px -28px var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
    transition:transform .45s cubic-bezier(.2,.9,.25,1);
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  .dial:active{transform:scale(.978)}
  .dial:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
  .dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .track{fill:none;stroke:var(--track);stroke-width:5}
  .sweep{
    fill:none;stroke:url(#grad);stroke-width:5;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:100px 100px;
    filter:drop-shadow(0 0 7px rgba(110,231,200,.35));
  }
  .minutes{
    fill:none;stroke:var(--accent-2);stroke-width:1.5;stroke-linecap:round;opacity:.5;
    transform:rotate(-90deg);transform-origin:100px 100px;
  }
  .ticks line{stroke:var(--hair);stroke-width:1.4;stroke-linecap:round}

  .pulse{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid var(--accent);
    opacity:0;pointer-events:none;
  }
  .pulse.go{animation:pulse .72s cubic-bezier(.16,.8,.3,1) forwards}
  @keyframes pulse{
    0%{opacity:.85;transform:scale(.82)}
    100%{opacity:0;transform:scale(1.16)}
  }

  .readout{position:relative;text-align:center;line-height:1}
  .time{
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"JetBrains Mono",monospace;
    font-variant-numeric:tabular-nums;
    font-size:clamp(38px,12.4vw,52px);
    font-weight:500;
    letter-spacing:-.025em;
    display:flex;align-items:baseline;justify-content:center;gap:2px;
  }
  .time .cs{font-size:.5em;color:var(--accent);letter-spacing:0;transform:translateY(-.08em)}
  .time.bump{animation:bump .5s cubic-bezier(.2,1.2,.3,1)}
  @keyframes bump{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
  .hint{
    margin-top:12px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--muted);transition:opacity .6s ease;
  }
  .hint.hide{opacity:0}

  /* ---------- metronome ---------- */
  .met{
    width:100%;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:14px 16px;
    padding:14px 16px 16px;
    border:1px solid var(--hair);
    border-radius:18px;
    background:var(--dial);
    box-shadow:0 18px 40px -34px var(--shadow);
  }
  .mbtn{
    width:38px;height:38px;flex:none;
    border:1px solid var(--hair);border-radius:50%;
    background:transparent;color:var(--muted);
    display:grid;place-items:center;cursor:pointer;
    transition:color .25s ease,border-color .25s ease,background .25s ease,transform .2s ease;
  }
  .mbtn:active{transform:scale(.93)}
  .mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .mbtn svg{width:15px;height:15px;fill:currentColor}
  .mbtn .i-stop{display:none}
  .mbtn.on{color:var(--accent);border-color:var(--accent);background:var(--bar)}
  .mbtn.on .i-play{display:none}
  .mbtn.on .i-stop{display:block}

  .mbpm{
    display:flex;align-items:baseline;gap:6px;
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    font-variant-numeric:tabular-nums;
  }
  .mbpm b{font-size:22px;font-weight:500;letter-spacing:-.02em}
  .mbpm span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

  .pips{display:flex;align-items:center;gap:5px}
  .pip{
    width:17px;height:17px;padding:0;border:0;background:transparent;
    display:grid;place-items:center;cursor:pointer;
  }
  .pip::after{
    content:"";width:7px;height:7px;border-radius:50%;
    background:var(--muted);opacity:.22;
    transition:opacity .25s ease,background .25s ease,transform .25s ease;
  }
  .pip.in::after{opacity:.5}
  .pip.cur::after{background:var(--accent);opacity:1}
  .pip.hit::after{animation:hit .42s cubic-bezier(.2,.9,.25,1)}
  @keyframes hit{0%{transform:scale(2.1)}100%{transform:scale(1)}}
  .pip:focus-visible{outline:1px solid var(--accent);outline-offset:1px;border-radius:50%}

  .slider{
    grid-column:1/-1;
    -webkit-appearance:none;appearance:none;
    width:100%;height:14px;margin:-2px 0 -6px;
    background:transparent;cursor:pointer;
  }
  .slider:focus-visible{outline:none}
  .slider::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:var(--track)}
  .slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;margin-top:-5px;
    border:0;border-radius:50%;background:var(--accent);
    box-shadow:0 2px 10px -2px var(--shadow);
  }
  .slider:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--bar)}
  .slider::-moz-range-track{height:2px;border-radius:2px;background:var(--track)}
  .slider::-moz-range-thumb{
    width:12px;height:12px;border:0;border-radius:50%;background:var(--accent);
  }
  .slider:focus-visible::-moz-range-thumb{box-shadow:0 0 0 4px var(--bar)}
  @media (prefers-reduced-motion:reduce){
    .pip.hit::after{animation:none}
  }

  /* ---------- log ---------- */
  .log{width:100%;display:flex;flex-direction:column;gap:10px}
  .log-head{
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
    padding:0 2px;
  }
  .log-head b{color:var(--ink);font-weight:500;letter-spacing:.1em}
  ol{
    list-style:none;margin:0;padding:0 2px;
    max-height:36vh;overflow-y:auto;overscroll-behavior:contain;
    -webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 88%,transparent 100%);
  }
  ol::-webkit-scrollbar{width:0}
  li{
    position:relative;isolation:isolate;
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
    padding:11px 4px;border-bottom:1px solid var(--hair);
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    font-variant-numeric:tabular-nums;
    animation:slide .42s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  li .bar{
    position:absolute;z-index:-1;top:3px;bottom:3px;left:-4px;
    width:max(3px,var(--w,0%));
    border-radius:2px 3px 3px 2px;
    background:linear-gradient(90deg,var(--bar-2),var(--bar));
    transition:width .55s cubic-bezier(.2,.9,.25,1);
    animation:grow .6s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes grow{from{width:max(3px,0%)}}
  li.top .bar{background:linear-gradient(90deg,var(--accent),var(--bar-2));opacity:.28}
  @media (prefers-reduced-motion:reduce){
    li .bar{animation:none;transition:none}
  }
  li .n{font-size:10px;color:var(--muted);min-width:1.9em}
  li .t{font-size:17px;letter-spacing:-.02em}
  li .w{font-size:10px;color:var(--muted);letter-spacing:.06em}
  li.top .t{color:var(--accent)}
  li.top .n::after{content:"";display:inline-block;width:4px;height:4px;margin-left:5px;
    border-radius:50%;background:var(--accent);vertical-align:middle}
  .empty{
    padding:18px 4px;font-size:12px;color:var(--muted);letter-spacing:.04em;
  }
</style>
</head>
<body>
<main>
  <div class="brand"><i></i>reset</div>

  <button class="dial" id="dial" aria-label="Reset the stopwatch">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--accent)"/>
          <stop offset="100%" stop-color="var(--accent-2)"/>
        </linearGradient>
      </defs>
      <g class="ticks" id="ticks"></g>
      <circle class="track" cx="100" cy="100" r="82"/>
      <circle class="sweep" id="sweep" cx="100" cy="100" r="82"/>
      <circle class="minutes" id="mins" cx="100" cy="100" r="92"/>
    </svg>
    <span class="pulse" id="pulse"></span>
    <span class="readout">
      <span class="time" id="time"><span id="main">0:00</span><span class="cs" id="cs">.00</span></span>
      <span class="hint" id="hint">tap to reset</span>
    </span>
  </button>

  <section class="met">
    <button class="mbtn" id="mbtn" aria-pressed="false" aria-label="Start metronome">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="i-play" d="M9 6.2 17.4 12 9 17.8z"/>
        <rect class="i-stop" x="8.5" y="8.5" width="7" height="7" rx="1.6"/>
      </svg>
    </button>
    <div class="mbpm"><b id="bpmVal">60</b><span>bpm</span></div>
    <div class="pips" id="pips" role="group" aria-label="Beats per bar"></div>
    <input class="slider" id="bpm" type="range" min="30" max="240" step="1" value="60"
           aria-label="Tempo in beats per minute">
  </section>

  <section class="log">
    <div class="log-head"><span>resets</span><span><b id="count">0</b></span></div>
    <ol id="list"></ol>
    <div class="empty" id="empty">Nothing yet — the dial is running.</div>
  </section>
</main>

<script>
(() => {
  const el = id => document.getElementById(id);
  const dial = el('dial'), sweep = el('sweep'), mins = el('mins'), pulse = el('pulse');
  const timeEl = el('time'), headEl = el('main'), csEl = el('cs');
  const list = el('list'), countEl = el('count'), emptyEl = el('empty'), hint = el('hint');

  const C1 = 2 * Math.PI * 82, C2 = 2 * Math.PI * 92;
  sweep.style.strokeDasharray = C1;
  mins.style.strokeDasharray = C2;

  // dial ticks, every 5 seconds
  const ticks = el('ticks');
  for (let i = 0; i < 60; i += 5) {
    const a = (i / 60) * 2 * Math.PI - Math.PI / 2;
    const r1 = 70, r2 = i % 15 === 0 ? 62 : 66;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 100 + Math.cos(a) * r1); l.setAttribute('y1', 100 + Math.sin(a) * r1);
    l.setAttribute('x2', 100 + Math.cos(a) * r2); l.setAttribute('y2', 100 + Math.sin(a) * r2);
    ticks.appendChild(l);
  }

  const pad = (n, w = 2) => String(n).padStart(w, '0');
  function parts(ms) {
    const t = Math.max(0, ms);
    const cs = Math.floor(t / 10) % 100;
    const s  = Math.floor(t / 1000) % 60;
    const m  = Math.floor(t / 60000) % 60;
    const h  = Math.floor(t / 3600000);
    return { h, m, s, cs,
      head: h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`,
      full: h ? `${h}:${pad(m)}:${pad(s)}.${pad(cs)}` : `${pad(m)}:${pad(s)}.${pad(cs)}` };
  }

  let start = performance.now();
  let n = 0, best = 0;

  function frame() {
    const ms = performance.now() - start;
    const p = parts(ms);
    headEl.textContent = p.head;
    csEl.textContent = '.' + pad(p.cs);
    const secs = (ms / 1000) % 60;
    const minsFrac = (ms / 60000) % 60;
    sweep.style.strokeDashoffset = C1 * (1 - secs / 60);
    mins.style.strokeDashoffset = C2 * (1 - minsFrac / 60);
    drawBeats();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function reset() {
    const ms = performance.now() - start;
    start = performance.now();

    pulse.classList.remove('go'); void pulse.offsetWidth; pulse.classList.add('go');
    timeEl.classList.remove('bump'); void timeEl.offsetWidth; timeEl.classList.add('bump');
    if (navigator.vibrate) navigator.vibrate(8);
    realign();

    n++;
    const li = document.createElement('li');
    li.innerHTML = `<span class="bar"></span>
      <span class="n">${pad(n)}</span>
      <span class="t">${parts(ms).full}</span>
      <span class="w">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
    li.dataset.ms = ms;
    list.prepend(li);
    countEl.textContent = n;
    emptyEl.hidden = true;
    hint.classList.add('hide');

    best = Math.max(best, ms);
    for (const row of list.children) {
      const v = +row.dataset.ms;
      row.style.setProperty('--w', (best ? (v / best) * 100 : 0).toFixed(2) + '%');
      row.classList.toggle('top', v === best);
    }
  }

  dial.addEventListener('click', reset);

  /* ---------- metronome ---------- */
  const mbtn = el('mbtn'), bpmSlider = el('bpm'), bpmVal = el('bpmVal'), pips = el('pips');
  const MAX_BEATS = 6, LOOKAHEAD = 0.3;
  let actx = null, master = null, noise = null;
  let ticking = false, bpm = +bpmSlider.value, beats = 4, beatIdx = 0, nextTime = 0, timer = null;
  const drawQ = [];   // beats awaiting their visual moment
  const live = [];    // scheduled audio nodes, so a realign can cancel them

  for (let i = 0; i < MAX_BEATS; i++) {
    const b = document.createElement('button');
    b.className = 'pip' + (i < beats ? ' in' : '');
    b.dataset.i = i;
    b.setAttribute('aria-label', `${i + 1} beat${i ? 's' : ''} per bar`);
    pips.appendChild(b);
  }

  function audio() {
    if (actx) return actx;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = 0.9;
    master.connect(actx.destination);
    noise = actx.createBuffer(1, Math.ceil(actx.sampleRate * 0.03), actx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    return actx;
  }

  function click(t, accent) {
    const f = accent ? 1560 : 1040;
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(accent ? .3 : .18, t + .002);
    g.gain.exponentialRampToValueAtTime(.0001, t + (accent ? .09 : .07));
    g.connect(master);
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * .62, t + .06);
    o.connect(g); o.start(t); o.stop(t + .13);

    const n = actx.createBufferSource(); n.buffer = noise;
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(accent ? .14 : .085, t);
    ng.gain.exponentialRampToValueAtTime(.0001, t + .03);
    n.connect(hp); hp.connect(ng); ng.connect(master);
    n.start(t); n.stop(t + .04);

    live.push({ t, nodes: [o, n] });
  }

  function schedule() {
    while (nextTime < actx.currentTime + LOOKAHEAD) {
      click(nextTime, beatIdx === 0);
      drawQ.push({ i: beatIdx, t: nextTime });
      nextTime += 60 / bpm;
      beatIdx = (beatIdx + 1) % beats;
    }
    while (live.length && live[0].t < actx.currentTime - .5) live.shift();
  }

  function silence(from) {
    for (const s of live) {
      if (s.t >= from) for (const nd of s.nodes) { try { nd.stop(from); } catch {} }
    }
    live.length = 0;
    drawQ.length = 0;
  }

  function metStart() {
    audio();
    if (actx.state === 'suspended') actx.resume();
    beatIdx = 0;
    nextTime = actx.currentTime + .06;
    schedule();
    timer = setInterval(schedule, 40);
    ticking = true;
    mbtn.classList.add('on');
    mbtn.setAttribute('aria-pressed', 'true');
    mbtn.setAttribute('aria-label', 'Stop metronome');
  }

  function metStop() {
    clearInterval(timer); timer = null;
    if (actx) silence(actx.currentTime);
    ticking = false;
    mbtn.classList.remove('on');
    mbtn.setAttribute('aria-pressed', 'false');
    mbtn.setAttribute('aria-label', 'Start metronome');
    for (const p of pips.children) p.classList.remove('cur', 'hit');
  }

  function realign() {            // next click lands now, on a downbeat
    if (!ticking) return;
    silence(actx.currentTime);
    beatIdx = 0;
    nextTime = actx.currentTime + .02;
    schedule();
  }

  // visual beat, drained by the animation loop against the audio clock
  function drawBeats() {
    if (!actx) return;
    while (drawQ.length && drawQ[0].t <= actx.currentTime) {
      const b = drawQ.shift();
      for (const p of pips.children) p.classList.remove('cur');
      const pip = pips.children[b.i];
      if (!pip) continue;
      pip.classList.add('cur');
      pip.classList.remove('hit'); void pip.offsetWidth; pip.classList.add('hit');
    }
  }

  mbtn.addEventListener('click', () => ticking ? metStop() : metStart());

  bpmSlider.addEventListener('input', () => {
    bpm = +bpmSlider.value;
    bpmVal.textContent = bpm;
  });

  pips.addEventListener('click', e => {
    const pip = e.target.closest('.pip');
    if (!pip) return;
    beats = +pip.dataset.i + 1;
    if (beatIdx >= beats) beatIdx = 0;
    for (const p of pips.children) p.classList.toggle('in', +p.dataset.i < beats);
  });

  addEventListener('keydown', e => {
    if (e.key === 'm' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); ticking ? metStop() : metStart(); }
  });

  // keep the screen awake while the app is open
  let lock = null;
  const wake = async () => {
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try { lock = await navigator.wakeLock.request('screen'); } catch {}
  };
  wake();
  document.addEventListener('visibilitychange', wake);
})();
</script>
</body>
</html>

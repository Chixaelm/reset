<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merhaba Antalya</title>
<meta name="description" content="Useful Turkish words and phrases for Antalya — with pronunciation, audio and a series of quick tests.">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b161c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Türkçe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a7f86'/%3E%3Ccircle cx='32' cy='27' r='11' fill='%23ffcf66'/%3E%3Cpath d='M8 45c6-5 10-5 16 0s10 5 16 0 10-5 16 0' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f1e7;
    --glow:#fbe1bd;
    --surface:#fffdf8;
    --surface-2:#efe7d8;
    --ink:#10252f;
    --muted:#56676c;
    --hair:rgba(16,37,47,.12);
    --accent:#0a7f86;
    --accent-ink:#ffffff;
    --accent-soft:rgba(10,127,134,.11);
    --say:#a84b17;
    --good:#1b7f47;
    --good-soft:rgba(27,127,71,.12);
    --bad:#c0322a;
    --bad-soft:rgba(192,50,42,.10);
    --warn:#c7870b;
    --shadow:0 1px 2px rgba(16,37,47,.05),0 6px 18px rgba(16,37,47,.06);
    --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b161c;
      --glow:#123440;
      --surface:#12222b;
      --surface-2:#1a2e38;
      --ink:#e7f1f2;
      --muted:#93a8ad;
      --hair:rgba(231,241,242,.12);
      --accent:#3cc4c4;
      --accent-ink:#052326;
      --accent-soft:rgba(60,196,196,.13);
      --say:#f3a06b;
      --good:#52c78c;
      --good-soft:rgba(82,199,140,.14);
      --bad:#ff7466;
      --bad-soft:rgba(255,116,102,.13);
      --warn:#f0b43c;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b161c;--glow:#123440;--surface:#12222b;--surface-2:#1a2e38;--ink:#e7f1f2;--muted:#93a8ad;
    --hair:rgba(231,241,242,.12);--accent:#3cc4c4;--accent-ink:#052326;--accent-soft:rgba(60,196,196,.13);
    --say:#f3a06b;--good:#52c78c;--good-soft:rgba(82,199,140,.14);--bad:#ff7466;--bad-soft:rgba(255,116,102,.13);
    --warn:#f0b43c;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(130% 55% at 50% -12%, var(--glow) 0%, transparent 62%) no-repeat, var(--bg);
    color:var(--ink);
    font:16px/1.45 var(--sans);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  button:disabled{cursor:default}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .shell{
    max-width:680px;
    margin:0 auto;
    padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  }

  /* ---------- header ---------- */
  .top{padding:10px 2px 14px}
  .brand{
    display:flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);
  }
  .brand i{width:6px;height:6px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad)}
  h1{
    font:600 clamp(36px,9vw,48px)/1.05 var(--serif);
    letter-spacing:-.01em;margin:10px 0 6px;
  }
  .lede{margin:0 0 14px;color:var(--muted);max-width:34em}
  .overall{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .overall .bar{flex:1;max-width:220px}
  .bar{height:6px;border-radius:99px;background:var(--hair);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:inherit;background:var(--good);transition:width .4s ease}
  .in-quiz .top,.in-quiz .tabs,.in-quiz footer{display:none}

  /* ---------- tabs ---------- */
  .tabs{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;gap:10px;
    margin:0 -16px 16px;padding:10px 16px;
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hair);
  }
  .seg{display:flex;flex:1;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
  .seg button{
    flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;
    font-weight:600;font-size:14px;color:var(--muted);
  }
  .seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .pill{
    border:1px solid var(--hair);background:var(--surface);border-radius:99px;
    padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;
  }
  .pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  /* ---------- learn ---------- */
  .search{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:0 12px;
  }
  .search svg{flex:none;color:var(--muted)}
  .search input{
    flex:1;min-width:0;border:0;background:transparent;color:var(--ink);
    font:inherit;padding:11px 0;outline:none;
  }
  .search:focus-within{border-color:var(--accent)}
  .chips{
    display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    margin:12px -16px 4px;padding:2px 16px 8px;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1px solid var(--hair);background:var(--surface);border-radius:99px;
    padding:7px 12px;font-size:14px;font-weight:500;
  }
  .chip span{color:var(--muted);font-size:12px;margin-left:2px}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip.on span{color:inherit;opacity:.7}

  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 2px 10px}
  .sec-head h2{font:600 22px/1.15 var(--serif);margin:0}
  .sec-head h2 small{display:block;font:500 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .link-btn{
    flex:none;border:0;background:var(--accent-soft);color:var(--accent);
    border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;
  }
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 2px 0}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}

  .list{display:grid;gap:10px}
  .card{
    position:relative;display:flex;gap:12px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--hair);border-radius:14px;
    padding:14px 14px 14px 16px;box-shadow:var(--shadow);cursor:pointer;
    overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
  .card.learning::before{background:var(--warn)}
  .card.known::before{background:var(--good)}
  .card-main{flex:1;min-width:0}
  .tr{font:600 21px/1.2 var(--serif);overflow-wrap:anywhere}
  .say{color:var(--say);font-weight:600;font-size:14px;letter-spacing:.02em;margin-top:3px;overflow-wrap:anywhere}
  .en{margin-top:4px}
  .note{margin:6px 0 0;font-size:13px;color:var(--muted)}
  .play{
    flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
    border:0;background:var(--accent-soft);color:var(--accent);
  }
  .play.playing{background:var(--accent);color:var(--accent-ink);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}

  /* ---------- tests ---------- */
  .h{font:600 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}
  .h:first-child{margin-top:4px}
  .mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mode{
    text-align:left;border:1px solid var(--hair);background:var(--surface);border-radius:12px;
    padding:10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0;
  }
  .mode b{font-size:15px}
  .mode span{font-size:12px;color:var(--muted)}
  .mode[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .mode:disabled{opacity:.45}
  .mode-desc{margin:10px 2px 0;font-size:14px;color:var(--muted)}

  .series{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .row{
    width:100%;display:flex;align-items:center;gap:12px;text-align:left;
    border:1px solid var(--hair);background:var(--surface);border-radius:14px;padding:12px 14px;
    box-shadow:var(--shadow);
  }
  .row:disabled{opacity:.5}
  .num{
    flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:var(--surface-2);font-weight:700;font-size:14px;
  }
  .num.done{background:var(--good);color:var(--surface)}
  .row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .row-main b{font-size:16px}
  .row-main small{color:var(--muted);font-size:13px}
  .row-main .bar{height:4px;max-width:160px}
  .best{flex:none;text-align:right;font-size:12px;color:var(--muted);line-height:1.2}
  .best b{display:block;font-size:17px;color:var(--ink)}
  .chev{flex:none;color:var(--muted)}

  /* ---------- quiz ---------- */
  .qtop{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
  .icon-btn{
    flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);
    background:var(--surface);display:grid;place-items:center;color:var(--muted);
  }
  .qtitle{flex:1;min-width:0;display:flex;flex-direction:column}
  .qtitle b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qtitle span{font-size:13px;color:var(--muted)}
  .qscore{
    flex:none;min-width:40px;height:40px;padding:0 10px;border-radius:99px;display:grid;place-items:center;
    background:var(--good-soft);color:var(--good);font-weight:700;
  }
  .qbar{height:5px;margin-bottom:18px}
  .qbar>span{background:var(--accent)}
  .qcard{
    background:var(--surface);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow);
    padding:22px 18px;text-align:center;
  }
  .qlabel{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .qprompt{font:600 clamp(26px,7.5vw,36px)/1.15 var(--serif);overflow-wrap:anywhere}
  .qprompt.en{font:600 clamp(22px,6vw,28px)/1.25 var(--sans)}
  .qprompt mark{background:var(--say);color:var(--surface);border-radius:6px;padding:0 .08em;margin:0 .02em}
  .qsay{color:var(--say);font-weight:600;margin-top:8px}
  .qplay{display:flex;justify-content:center;gap:10px;margin-top:14px}
  .big-play{
    width:84px;height:84px;border-radius:50%;border:0;display:grid;place-items:center;
    background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px var(--accent-soft);
  }
  .big-play.playing{animation:pulse 1s ease-in-out infinite}
  .soft-btn{
    border:1px solid var(--hair);background:var(--surface);border-radius:99px;padding:8px 14px;
    font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px;
  }
  .answers{display:grid;gap:8px;margin-top:14px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:13px 14px;
    font-size:17px;box-shadow:var(--shadow);transition:transform .08s ease;
  }
  .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{
    flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:var(--surface-2);font-size:13px;font-weight:700;color:var(--muted);
  }
  .opt[lang="tr"] .lbl{font-family:var(--serif);font-weight:600;font-size:19px}
  .opt .lbl{flex:1;min-width:0;overflow-wrap:anywhere}
  .opt .lbl small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--muted)}
  .opt.right{border-color:var(--good);background:var(--good-soft)}
  .opt.right .k{background:var(--good);color:var(--surface)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .k{background:var(--bad);color:var(--surface)}
  .opt.dim{opacity:.5}

  .typebox{display:grid;gap:10px}
  .typebox input{
    width:100%;font:600 20px/1.2 var(--serif);color:var(--ink);background:var(--surface);
    border:1px solid var(--hair);border-radius:14px;padding:14px;outline:none;
  }
  .typebox input:focus{border-color:var(--accent)}
  .typebox input.ok{border-color:var(--good);background:var(--good-soft)}
  .typebox input.no{border-color:var(--bad);background:var(--bad-soft)}
  .keys{display:flex;flex-wrap:wrap;gap:6px}
  .keys button{
    min-width:42px;height:42px;border-radius:10px;border:1px solid var(--hair);background:var(--surface);
    font:600 18px/1 var(--serif);
  }
  .type-actions{display:flex;gap:8px}
  .type-actions .primary{flex:1}

  .fb{display:flex;align-items:baseline;gap:8px;margin:16px 2px 8px;font-size:15px}
  .fb b{font:600 22px/1 var(--serif)}
  .fb.good b{color:var(--good)}
  .fb.bad b{color:var(--bad)}
  .fb span{color:var(--muted)}
  .reveal{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--surface-2);border-radius:14px;padding:14px 14px 14px 16px;
  }
  .reveal .hint{margin:8px 0 0;font-size:14px}
  .primary{
    border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;
    padding:14px 18px;font-size:16px;font-weight:700;
  }
  .next{width:100%;margin-top:12px}
  .kbd-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
  @media (hover:none){.kbd-hint{display:none}}

  /* ---------- results ---------- */
  .result{text-align:center;padding:10px 0}
  .ring{width:150px;height:150px;margin:6px auto 4px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-content:center;font:600 34px/1 var(--serif)}
  .ring .val small{display:block;font:500 13px/1.4 var(--sans);color:var(--muted)}
  .result h2{font:600 32px/1.1 var(--serif);margin:10px 0 2px}
  .result p{margin:4px 0;color:var(--muted)}
  .newbest{display:inline-block;margin-top:8px;background:var(--good-soft);color:var(--good);font-weight:700;font-size:13px;border-radius:99px;padding:5px 12px}
  .result .actions{display:grid;gap:8px;margin:20px 0 6px}
  .result .actions .soft-btn{justify-content:center;padding:13px 14px;border-radius:14px}
  .missed{text-align:left}

  /* ---------- sounds ---------- */
  .prose{color:var(--muted);margin:0 2px 14px}
  .letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .letter{
    text-align:left;border:1px solid var(--hair);background:var(--surface);border-radius:14px;
    padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-width:0;
  }
  .letter .L{font:600 28px/1 var(--serif)}
  .letter .S{font-size:14px}
  .letter .S b{color:var(--say)}
  .letter .ex{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .letter .ex em{font-family:var(--serif);font-style:normal;font-weight:600;color:var(--ink);font-size:15px}
  .tips{margin:0;padding:0 2px 0 20px;display:grid;gap:8px}
  .tips li{padding-left:2px}
  .key{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;
    background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;
  }
  .key div{font-size:14px;color:var(--muted)}
  .key b{color:var(--say);display:inline-block;min-width:2.4em}
  .key em{font-family:var(--serif);font-style:normal;font-weight:600;color:var(--ink)}
  .panel{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px;display:grid;gap:12px}
  .voice{font-size:14px}
  .voice.ok b{color:var(--good)}
  .voice.no b{color:var(--bad)}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
  .switch small{display:block;color:var(--muted);font-size:13px}
  .toggle{
    flex:none;width:50px;height:30px;border-radius:99px;border:0;background:var(--hair);position:relative;
    transition:background .2s;
  }
  .toggle::after{
    content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;
  }
  .toggle[aria-checked="true"]{background:var(--accent)}
  .toggle[aria-checked="true"]::after{transform:translateX(20px)}
  .cta{width:100%;margin-top:14px}

  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--hair);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between}
  footer button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
  footer .foot-actions{display:flex;gap:14px}
  footer #installBtn{color:var(--accent);font-weight:700}
  #offlineTxt.ready::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:1px}
  #iosHint{flex-basis:100%;margin:2px 0 0}

  #toast{
    position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);
    max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:420px){
    .mode-grid{grid-template-columns:repeat(2,1fr)}
    .tr{font-size:19px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><i></i>Türkçe · Antalya</div>
    <h1>Merhaba!</h1>
    <p class="lede">Everyday Turkish for the coast. Hear each phrase, read it aloud from the respelling, then test yourself.</p>
    <div class="overall"><div class="bar"><span id="knownBar" style="width:0"></span></div><span id="knownTxt"></span></div>
  </header>

  <nav class="tabs">
    <div class="seg" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="learn" aria-selected="true">Learn</button>
      <button role="tab" data-tab="tests" aria-selected="false">Tests</button>
      <button role="tab" data-tab="sounds" aria-selected="false">Sounds</button>
    </div>
    <button class="pill" id="slowBtn" aria-pressed="false" title="Play audio slowly">Slow</button>
  </nav>

  <main id="view"></main>

  <footer>
    <span id="offlineTxt">Progress is saved on this device only.</span>
    <span class="foot-actions">
      <button id="installBtn" type="button" hidden>Install app</button>
      <button id="resetBtn" type="button">Reset progress</button>
    </span>
    <p id="iosHint" hidden>To install on iPhone or iPad: open this page in Safari, tap Share, then “Add to Home Screen”.</p>
  </footer>
</div>

/* ---------- Quiz ---------- */
function pickSet(key){
  if (CAT[key]) return { title: CAT[key].name, list: shuffle(inCat(key)) };
  if (key === 'all') return { title: 'Everything', list: shuffle(PHRASES).slice(0, 20) };
  if (key === 'review') {
    const rank = p => { const s = S.stats[p.id]; if (!s) return 50 + Math.random(); if (s.s >= 2) return 100 + s.c - s.w; return s.s * 10 - s.w * 3 + s.c; };
    return { title: 'Review', list: shuffle(PHRASES.slice().sort((a, b) => rank(a) - rank(b)).slice(0, 15)) };
  }
  if (key === 'letters') return { title: 'Letters', list: shuffle(PHRASES).slice(0, 20) };
  return { title: 'Test', list: shuffle(PHRASES).slice(0, 10) };
}
function distractors(p, label){
  const ok = q => q !== p && !(p.group && q.group === p.group) && label(q) !== label(p);
  const pool = shuffle(PHRASES.filter(q => q.cat === p.cat && ok(q)));
  const out = [];
  for (const q of pool) { if (out.length === 3) break; if (!out.some(o => label(o) === label(q))) out.push(q); }
  for (const q of shuffle(PHRASES.filter(ok))) { if (out.length === 3) break; if (!out.some(o => label(o) === label(q))) out.push(q); }
  return out;
}
function letterTarget(p){
  const chars = [...p.tr];
  for (const tier of LETTER_TIERS) {
    const idx = [];
    chars.forEach((ch, i) => { if (tier.includes(trLower(ch))) idx.push(i); });
    if (idx.length) { const i = idx[Math.random() * idx.length | 0]; return { i, ch: trLower(chars[i]) }; }
  }
  return null;
}
function makeQ(p, type){
  if (type === 'letters') {
    const t = letterTarget(p);
    if (!t) return makeQ(p, 'meaning');
    const opts = shuffle([t.ch, ...shuffle(CONFUSE[t.ch]).slice(0, 3)]);
    return { type, p, letter: t, opts, ans: opts.indexOf(t.ch) };
  }
  if (type === 'spell') return { type, p };
  const label = type === 'recall' ? (q => q.tr) : (q => q.en);
  const opts = shuffle([p, ...distractors(p, label)]);
  return { type, p, opts, ans: opts.indexOf(p) };
}
function startQuiz(key, mode = S.prefs.mode, list){
  if (mode === 'listen' && audioState() === 'none') mode = 'meaning';
  const set = list ? { title: 'Retry', list: shuffle(list) } : pickSet(key);
  const canListen = audioState() !== 'none';
  const qs = set.list.map(p => {
    let type = mode;
    if (mode === 'mixed') {
      const r = Math.random();
      type = r < .34 ? 'meaning' : r < .6 ? 'recall' : r < .8 && canListen ? 'listen' : 'letters';
    }
    return makeQ(p, type);
  });
  quiz = { key, mode, title: set.title, list: set.list, qs, i: 0, score: 0, answered: false, picked: -1, missed: [], typed: '', verdict: '' };
  result = null;
  document.body.classList.add('in-quiz');
  window.scrollTo(0, 0);
  renderQuiz();
  autoplayQuestion();
}
function autoplayQuestion(){
  const q = quiz && quiz.qs[quiz.i];
  // Called straight from the tap that started/advanced the test, so iOS lets it speak.
  if (q && q.type === 'listen') sayPhrase(q.p.id, $('.big-play'));
}
function highlight(p, t){
  return [...p.tr].map((ch, i) => i === t.i ? `<mark>${esc(ch)}</mark>` : esc(ch)).join('');
}
function promptHTML(q){
  const p = q.p;
  switch (q.type) {
    case 'meaning': return `<div class="qlabel">What does this mean?</div>
      <div class="qprompt" lang="tr">${esc(p.tr)}</div><div class="qsay">${esc(p.say)}</div>
      <div class="qplay"><button class="soft-btn" type="button" data-play="${esc(p.id)}">${ICON.speaker} Hear it</button></div>`;
    case 'recall': return `<div class="qlabel">How do you say…</div><div class="qprompt en">${esc(p.en)}</div>`;
    case 'listen': return `<div class="qlabel">Listen — what does it mean?</div>
      <div class="qplay"><button class="big-play" type="button" data-play="${esc(p.id)}" aria-label="Play the phrase">${ICON.speakerBig}</button></div>
      <div class="qplay"><button class="soft-btn" type="button" data-play-slow="${esc(p.id)}">Play slowly</button></div>
      ${quiz.answered ? `<div class="qprompt" lang="tr" style="margin-top:14px">${esc(p.tr)}</div>` : ''}`;
    case 'letters': return `<div class="qlabel">How is the highlighted letter said?</div>
      <div class="qprompt" lang="tr">${highlight(p, q.letter)}</div>
      ${quiz.answered ? `<div class="qsay">${esc(p.say)}</div>` : ''}`;
    case 'spell': return `<div class="qlabel">Type this in Turkish</div><div class="qprompt en">${esc(p.en)}</div>`;
  }
}
function optLabel(q, o){
  if (q.type === 'letters') { const s = SOUNDS[o]; return `<span class="lbl"><b>${esc(s.k)}</b> <small>${esc(s.d)}</small></span>`; }
  if (q.type === 'recall') return `<span class="lbl">${esc(o.tr)}</span>`;
  return `<span class="lbl">${esc(o.en)}</span>`;
}
function answersHTML(q){
  if (q.type === 'spell') {
    const cls = quiz.answered ? (quiz.verdict === 'wrong' ? 'no' : 'ok') : '';
    return `<form class="typebox" id="spellForm" autocomplete="off">
      <input id="spellIn" lang="tr" class="${cls}" value="${esc(quiz.typed)}" ${quiz.answered ? 'readonly' : ''} placeholder="Type here…" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer in Turkish">
      ${quiz.answered ? '' : `<div class="keys" aria-label="Turkish letters">${['ç','ğ','ı','İ','ö','ş','ü'].map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}</div>
      <div class="type-actions"><button class="primary" type="submit">Check</button><button class="soft-btn" type="button" data-action="giveup">Show me</button></div>`}
    </form>`;
  }
  const lang = q.type === 'recall' ? ' lang="tr"' : '';
  return q.opts.map((o, i) => {
    let cls = '';
    if (quiz.answered) cls = i === q.ans ? 'right' : i === quiz.picked ? 'wrong' : 'dim';
    return `<button class="opt ${cls}" type="button" data-opt="${i}"${lang} ${quiz.answered ? 'disabled' : ''}><span class="k">${i + 1}</span>${optLabel(q, o)}</button>`;
  }).join('');
}
function feedbackHTML(q){
  const good = quiz.verdict !== 'wrong';
  let sub = good ? 'Correct' : 'Not quite';
  if (q.type === 'spell') {
    if (quiz.verdict === 'accents') sub = 'Correct — mind the Turkish letters';
    if (quiz.verdict === 'close') sub = 'Correct — one letter off';
  }
  let hint = '';
  if (q.type === 'letters') {
    const s = SOUNDS[q.letter.ch];
    hint = `<p class="hint"><b>${esc(q.letter.ch)}</b> sounds like <b>${esc(s.k)}</b> — ${esc(s.d)}.</p>`;
  }
  if (q.type === 'spell' && quiz.verdict !== 'exact') {
    hint += `<p class="hint">Spelled: <b lang="tr">${esc(q.p.tr)}</b></p>`;
  }
  const last = quiz.i === quiz.qs.length - 1;
  return `<div class="fb ${good ? 'good' : 'bad'}"><b lang="tr">${good ? 'Doğru!' : 'Yanlış'}</b><span>${sub}</span></div>
    <div class="reveal" data-play="${esc(q.p.id)}">
      <div class="card-main">
        <div class="tr" lang="tr">${esc(q.p.tr)}</div>
        <div class="say">${esc(q.p.say)}</div>
        <div class="en">${esc(q.p.en)}</div>
        ${q.p.note ? `<p class="note">${esc(q.p.note)}</p>` : ''}
        ${hint}
      </div>
      <button class="play" type="button" data-play="${esc(q.p.id)}" aria-label="Hear ${esc(q.p.tr)}">${ICON.speaker}</button>
    </div>
    <button class="primary next" type="button" data-action="next">${last ? 'See results' : 'Next'}</button>
    <p class="kbd-hint">${q.type === 'spell' ? 'Enter for next' : 'Keys: 1–4 to answer · Enter for next'}</p>`;
}
function renderQuiz(){
  const q = quiz.qs[quiz.i], n = quiz.qs.length;
  const pct = ((quiz.i + (quiz.answered ? 1 : 0)) / n * 100).toFixed(1);
  view.innerHTML = `
    <div class="qtop">
      <button class="icon-btn" type="button" data-action="quit" aria-label="Quit test">${ICON.x}</button>
      <div class="qtitle"><b>${esc(quiz.title)}</b><span>${esc(MODE[quiz.mode].name)} · ${quiz.i + 1} of ${n}</span></div>
      <div class="qscore" title="Correct so far">${quiz.score}</div>
    </div>
    <div class="bar qbar"><span style="width:${pct}%"></span></div>
    <section class="qcard">${promptHTML(q)}</section>
    <div class="answers">${answersHTML(q)}</div>
    <div id="feedback" aria-live="polite">${quiz.answered ? feedbackHTML(q) : ''}</div>`;
  if (quiz.answered) { const nb = $('.next'); if (nb) nb.focus({ preventScroll: true }); }
  else if (q.type === 'spell') { const inp = $('#spellIn'); if (inp && matchMedia('(hover:hover)').matches) inp.focus(); }
}
function record(id, right){
  const s = S.stats[id] || (S.stats[id] = { c:0, w:0, s:0 });
  if (right) { s.c++; s.s++; } else { s.w++; s.s = 0; }
  store.set('stats', S.stats);
  updateKnown();
}
function settle(right){
  const q = quiz.qs[quiz.i];
  quiz.answered = true;
  if (right) quiz.score++; else quiz.missed.push(q.p);
  record(q.p.id, right);
  renderQuiz();
  const fb = $('#feedback');
  if (fb && fb.getBoundingClientRect().bottom > innerHeight) fb.scrollIntoView({ behavior: 'smooth', block: 'end' });
  if (S.prefs.auto && q.type !== 'listen') sayPhrase(q.p.id, $('.reveal .play'));
}
function answer(i){
  if (!quiz || quiz.answered) return;
  const q = quiz.qs[quiz.i];
  if (q.type === 'spell' || i < 0 || i >= q.opts.length) return;
  quiz.picked = i;
  quiz.verdict = i === q.ans ? 'exact' : 'wrong';
  settle(i === q.ans);
}
function checkSpelling(giveUp){
  if (!quiz || quiz.answered) return;
  const q = quiz.qs[quiz.i];
  const raw = ($('#spellIn') || {}).value || '';
  if (!giveUp && !raw.trim()) { toast('Type your answer first — or tap “Show me”.'); return; }
  quiz.typed = raw;
  // Typed text: a plain "I" on an English keyboard most likely means i, so don't use Turkish casing here.
  const typed = clean(raw.replace(/İ/g, 'i').toLowerCase());
  const want = clean(trLower(q.p.tr));
  let v = 'wrong';
  if (!giveUp) {
    if (typed === want) v = 'exact';
    else if (fold(typed) === fold(want)) v = 'accents';
    else if (want.length >= 6 && lev(fold(typed), fold(want)) <= 1) v = 'close';
  }
  quiz.verdict = v;
  settle(v !== 'wrong');
}
function next(){
  if (!quiz || !quiz.answered) return;
  if (quiz.i < quiz.qs.length - 1) {
    quiz.i++; quiz.answered = false; quiz.picked = -1; quiz.typed = ''; quiz.verdict = '';
    renderQuiz(); window.scrollTo(0, 0); autoplayQuestion();
  } else finish();
}
function finish(){
  const { key, mode, score, qs, missed, title, list } = quiz;
  let newBest = false;
  if (key !== 'retry') {
    const k = key + '|' + mode, prev = S.best[k];
    if (!prev || score / qs.length > prev.s / prev.n) { S.best[k] = { s: score, n: qs.length }; store.set('best', S.best); newBest = !!prev; }
  }
  result = { key, mode, score, n: qs.length, missed, title, list, newBest };
  quiz = null;
  renderResult();
  window.scrollTo(0, 0);
}
function renderResult(){
  const r = result, pct = r.score / r.n;
  const [tr, en] = pct === 1 ? ['Mükemmel!', 'Perfect'] : pct >= .8 ? ['Çok iyi!', 'Very good'] : pct >= .5 ? ['İyi!', 'Good — keep going'] : ['Devam!', 'Keep at it — it sticks with repetition'];
  const C = 2 * Math.PI * 64;
  view.innerHTML = `
    <div class="qtop">
      <button class="icon-btn" type="button" data-action="back" aria-label="Back to tests">${ICON.x}</button>
      <div class="qtitle"><b>${esc(r.title)}</b><span>${esc(MODE[r.mode].name)} · finished</span></div>
    </div>
    <div class="result">
      <div class="ring">
        <svg viewBox="0 0 150 150" width="150" height="150" aria-hidden="true">
          <circle cx="75" cy="75" r="64" fill="none" stroke="var(--hair)" stroke-width="10"/>
          ${pct > 0 ? `<circle cx="75" cy="75" r="64" fill="none" stroke="var(--good)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${(C * pct).toFixed(1)} ${C.toFixed(1)}"/>` : ''}
        </svg>
        <div class="val">${r.score}/${r.n}<small>correct</small></div>
      </div>
      <h2 lang="tr">${tr}</h2>
      <p>${en}.</p>
      ${r.newBest ? '<span class="newbest">New best for this test</span>' : ''}
      <div class="actions">
        ${r.missed.length ? `<button class="primary" type="button" data-action="retry">Retry the ${r.missed.length} you missed</button>` : ''}
        <button class="soft-btn" type="button" data-action="again">Take this test again</button>
        <button class="soft-btn" type="button" data-action="back">All tests</button>
      </div>
    </div>
    ${r.missed.length ? `<h2 class="h">To practise</h2><div class="list missed">${r.missed.map(p => cardHTML(p)).join('')}</div>` : ''}`;
}

    </div>

    <h2 class="h">Tips</h2>
    <ul class="tips">
      <li><b>Stress is light</b> and usually on the last syllable. In the respellings, <span style="color:var(--say);font-weight:600">CAPITALS</span> mark the syllable when the stress moves somewhere else — like <span style="color:var(--say);font-weight:600">LEWT-fen</span> (lütfen).</li>
      <li><b>Double letters are held longer</b>: el-lee (elli), teh-shek-kewr (teşekkür).</li>
      <li><b>Always sound the h</b> — kahve is kah-veh, not “ka-veh”.</li>
      <li><b>The r is tapped</b>, and softer and breathier at the end of a word.</li>
      <li><b>I/ı and İ/i are different letters.</b> Dotless ı is the “uh” sound; dotted i is “ee” — even as a capital: İstanbul.</li>
      <li><b>Endings change to match the word</b> (vowel harmony) — that’s why you see both <em lang="tr">-lar</em> and <em lang="tr">-ler</em>.</li>
    </ul>

    <h2 class="h">Audio</h2>
    <div class="panel">
      ${voiceLine}
      <div class="switch"><span>Slow speech<small>Plays every phrase at a gentler pace.</small></span><button class="toggle" type="button" role="switch" data-pref="slow" aria-checked="${!!S.prefs.slow}" aria-label="Slow speech"></button></div>
      <div class="switch"><span>Play answers in tests<small>Hear the phrase each time you answer.</small></span><button class="toggle" type="button" role="switch" data-pref="auto" aria-checked="${!!S.prefs.auto}" aria-label="Play answers in tests"></button></div>
      <div><button class="soft-btn" type="button" data-speak="Merhaba, hoş geldiniz!">${ICON.speaker} Test the voice</button></div>
    </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-play], [data-speak]');
  if (!t) return;

  if (t.dataset.tab) { setTab(t.dataset.tab); window.scrollTo(0, 0); return; }
  if (t.id === 'slowBtn') { S.prefs.slow = !S.prefs.slow; savePrefs(); syncSlow(); if (S.prefs.tab === 'sounds' && !quiz && !result) renderSounds(); toast(S.prefs.slow ? 'Slow speech on' : 'Normal speed'); return; }
  if (t.id === 'resetBtn') {
    if (confirm('Clear all your progress and best scores on this device?')) { S.stats = {}; S.best = {}; store.set('stats', {}); store.set('best', {}); updateKnown(); setTab(S.prefs.tab); toast('Progress cleared'); }
    return;
  }
  if (t.dataset.cat) { learnCat = t.dataset.cat; learnQ = ''; const q = $('#q'); if (q) q.value = ''; renderLearnList(); return; }
  if (t.dataset.mode) { S.prefs.mode = t.dataset.mode; savePrefs(); renderTests(); return; }
  if (t.dataset.start) { startQuiz(t.dataset.start, t.dataset.modeForce || (t.dataset.start === 'letters' ? 'letters' : S.prefs.mode)); return; }
  if (t.dataset.pref) { S.prefs[t.dataset.pref] = !S.prefs[t.dataset.pref]; savePrefs(); syncSlow(); renderSounds(); return; }
  if (t.dataset.speak) { speak(t.dataset.speak, t.classList.contains('letter') ? null : t); return; }
  if (t.dataset.playSlow) { sayPhrase(t.dataset.playSlow, $('.big-play'), true); return; }
  if (t.dataset.play) {
    const btn = t.matches('.play, .big-play, .soft-btn') ? t : t.querySelector('.play');
    sayPhrase(t.dataset.play, btn); return;
  }
  if (t.dataset.opt) { answer(+t.dataset.opt); return; }
  if (t.dataset.key) {
    const inp = $('#spellIn'); if (!inp) return;
    const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, a) + t.dataset.key + inp.value.slice(b);
    inp.focus(); inp.setSelectionRange(a + 1, a + 1); return;
  }
  switch (t.dataset.action) {
    case 'next': next(); break;
    case 'giveup': checkSpelling(true); break;
    case 'quit': case 'back': if (synth) synth.cancel(); setTab('tests'); window.scrollTo(0, 0); break;
    case 'again': startQuiz(result.key, result.mode, result.key === 'retry' ? result.list : undefined); break;
    case 'retry': startQuiz('retry', result.mode, result.missed); break;
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'spellForm') { e.preventDefault(); checkSpelling(false); } });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { learnQ = e.target.value.trim(); renderLearnList(); }
});
document.addEventListener('keydown', e => {
  if (!quiz || e.metaKey || e.ctrlKey || e.altKey) return;
  const inInput = e.target.tagName === 'INPUT';
  if (!quiz.answered && !inInput && /^[1-4]$/.test(e.key)) { answer(+e.key - 1); e.preventDefault(); }
  else if (quiz.answered && (e.key === 'Enter' || e.key === ' ') && e.target.tagName !== 'BUTTON') { next(); e.preventDefault(); }
  else if (e.key === 'Escape') { if (synth) synth.cancel(); setTab('tests'); }
});

/* ---------- offline & install ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.ready.then(() => {
    const t = $('#offlineTxt');
    t.textContent = 'Saved for offline use · progress stays on this device';
    t.classList.add('ready');
  });
}
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; $('#installBtn').hidden = false; });
addEventListener('appinstalled', () => { installPrompt = null; $('#installBtn').hidden = true; toast('Installed — find “Türkçe” on your home screen'); });
$('#installBtn').addEventListener('click', async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  try { await installPrompt.userChoice; } catch (e) {}
  installPrompt = null; $('#installBtn').hidden = true;
});
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS && !standalone) $('#iosHint').hidden = false;

/* ---------- go ---------- */
loadVoices();
setTimeout(loadVoices, 600);
setTimeout(() => { loadVoices(); if (synth && !voicesLoaded) { voicesLoaded = true; loadVoices(); } }, 2500);
syncSlow();
updateKnown();
setTab(['learn', 'tests', 'sounds'].includes(S.prefs.tab) ? S.prefs.tab : 'learn');
})();
</script>
</body>
</html>
